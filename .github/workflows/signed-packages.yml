name: Signed packages
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to package
        required: true
        type: choice
        default: android
        options: [android, ios, both]
      ios_method:
        description: Must match the uploaded Apple provisioning profile
        type: choice
        default: app-store-connect
        options: [app-store-connect, release-testing]
permissions:
  contents: read
concurrency:
  group: signed-${{ github.ref }}
  cancel-in-progress: false
jobs:
  contract:
    uses: ./.github/workflows/studio-contract.yml
  android:
    needs: contract
    if: inputs.platform == 'android' || inputs.platform == 'both'
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --fatal-infos && flutter test
      - name: Install Android signing material
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: python3 scripts/android-signing.py
      - run: flutter build apk --release --build-number=${{ github.run_number }}
      - run: flutter build appbundle --release --build-number=${{ github.run_number }}
      - name: Verify signature and checksum
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify-android-release.sh build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/bundle/release/app-release.aab > build/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-signed-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
            build/SHA256SUMS.txt
          if-no-files-found: error
      - name: Remove temporary signing material
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/ekko-upload.jks"
  ios:
    needs: contract
    if: inputs.platform == 'ios' || inputs.platform == 'both'
    environment: release
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --fatal-infos && flutter test
      - name: Build signed archive and export IPA
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_EXPORT_METHOD: ${{ inputs.ios_method }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: bash scripts/ios-package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ios-signed-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error

name: Mobile CI
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver
      - name: Validate automation scripts
        run: |
          bash -n scripts/studio-contract.sh scripts/ios-package.sh scripts/verify-android-release.sh
          python3 -m py_compile scripts/android-signing.py
      - run: flutter analyze --fatal-infos
      - run: flutter test --coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: error
  contract:
    needs: quality
    uses: ./.github/workflows/studio-contract.yml
  android:
    needs: [quality, contract]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      # A debug APK is installable without exposing a production signing key to PRs.
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      # Profile is AOT + debug-signed: installable for performance evaluation,
      # NOT a production-signed release. Release/AAB compilation is also gated.
      - run: flutter build apk --profile --target-platform android-arm64
      - name: Verify installable profile APK
        shell: bash
        run: |
          set -euo pipefail
          SIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          "$SIGNER" verify build/app/outputs/flutter-apk/app-profile.apk
      - run: flutter build apk --release
      - run: flutter build appbundle --release
      - name: Artifact checksums
        run: |
          sha256sum build/app/outputs/flutter-apk/app-profile.apk \
            build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/bundle/release/app-release.aab > build/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-profile-apk-and-unsigned-release
          path: |
            build/app/outputs/flutter-apk/app-profile.apk
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
            build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
  ios:
    needs: [quality, contract]
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build ios --simulator --debug
      - run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app build/ios/ekko-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: build/ios/ekko-simulator.zip
          if-no-files-found: error
          retention-days: 14
      - run: flutter build ios --release --no-codesign
      - run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app build/ios/ekko-ios-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-app-NOT-installable
          path: build/ios/ekko-ios-unsigned.zip
          if-no-files-found: error
          retention-days: 14

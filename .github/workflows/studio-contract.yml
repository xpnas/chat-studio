name: Studio contract
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: mobile
      - uses: actions/checkout@v4
        with:
          repository: EKKOLearnAI/hermes-studio
          ref: b44c74318fe5a0a1f3aed29d5095393964fc3d62
          path: studio
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.1'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: studio
      - run: npx vitest run tests/server/app-connections-auth.test.ts tests/server/user-auth.test.ts
        working-directory: studio
      - run: python3 scripts/verify-app-identity.py
        working-directory: mobile
      - run: flutter pub get --enforce-lockfile
        working-directory: mobile
      - name: Exercise real Studio with local model fixture
        shell: bash
        working-directory: mobile
        run: bash scripts/studio-contract.sh ../studio
